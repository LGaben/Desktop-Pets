<style>
#pet-menu-motion-20261103 .pm-app{--pm-bg:light-dark(#fffdf9,#252623);--pm-ink:light-dark(#30352e,#f2f2e9);--pm-muted:light-dark(#64705f,#bdc5b6);--pm-line:light-dark(#d8dfd2,#4a5144);--pm-soft:light-dark(#eaf1e4,#35432e);--pm-green:light-dark(#426b39,#a6c794);--pm-radius:14px;font:14px/1.4 "Segoe UI",sans-serif;color:var(--pm-ink);padding:16px 12px 22px;min-height:690px;display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box;position:relative}
#pet-menu-motion-20261103 .pm-app *{box-sizing:border-box}
#pet-menu-motion-20261103 [hidden]{display:none!important}
#pet-menu-motion-20261103 header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-right:80px;min-height:44px}
#pet-menu-motion-20261103 button,#pet-menu-motion-20261103 select{font:inherit;color:var(--pm-ink);background:var(--pm-bg);border:1px solid var(--pm-line);border-radius:9px;min-height:44px;padding:8px 12px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
#pet-menu-motion-20261103 button:hover{background:var(--pm-soft)}
#pet-menu-motion-20261103 button[aria-pressed=true]{background:var(--pm-soft);border-color:var(--pm-green)}
#pet-menu-motion-20261103 button svg{width:17px;height:17px;flex-shrink:0}
#pet-menu-motion-20261103 .pm-global{width:300px;max-width:100%;background:var(--pm-bg);border:1px solid var(--pm-line);padding:12px;border-radius:var(--pm-radius);display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:9px 12px;box-shadow:0 5px 18px light-dark(#25322114,#00000035)}
#pet-menu-motion-20261103 .pm-global label{grid-column:1/-1;font-weight:500}
#pet-menu-motion-20261103 .pm-global select{width:100%;font-size:16px}

#pet-menu-motion-20261103 button.pm-ball{position:absolute;width:26px;height:26px;min-height:26px;padding:0;border:3px solid var(--pm-bg);border-radius:50%;background:var(--pm-green);left:65%;top:150px;box-shadow:0 0 0 1px var(--pm-line)}
#pet-menu-motion-20261103 .pm-heart{position:absolute;font-size:23px;color:var(--pm-green);pointer-events:none}

#pet-menu-motion-20261103 .pm-actions>button{border:0;justify-content:flex-start;min-height:36px;padding:7px 12px}

#pet-menu-motion-20261103 .pm-actions[data-layout=ring]{width:338px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:48px 61px 61px 48px;gap:6px;padding:9px;background:transparent;border:0;box-shadow:none}
#pet-menu-motion-20261103 .pm-actions[data-layout=ring]>button{background:var(--pm-bg);border:1px solid var(--pm-line);border-radius:var(--pm-radius);justify-content:center;flex-direction:column;gap:3px;padding:5px;font-size:12px}

<script>
(() => {
  const root = document.getElementById('pet-menu-motion-20261103');
  const app = root.querySelector('.pm-app');
  const arena = root.querySelector('.pm-arena');
  const pet = root.querySelector('.pm-pet');
  const image = pet.querySelector('img');
  const sprites = JSON.parse(document.getElementById('pm-sprites').textContent);
  const actions = root.querySelector('.pm-actions');
  const globalMenu = root.querySelector('.pm-global');
  const style = root.querySelector('#pm-style');
  const status = root.querySelector('.pm-status');
  const main = root.querySelector('[data-main]');
  const opener = root.querySelector('[data-open]');
  const pause = root.querySelector('[data-pause]');
  const ball = root.querySelector('.pm-ball');
  const heart = root.querySelector('.pm-heart');
  const state = {style:'panel',paused:false,sleep:false,follow:false,playing:false};
  const motion = {x:100,y:90,target:null,previous:null,lastSample:0,lastPlan:-1000,engaged:false,flee:false,encounter:0,frame:0,lastFrame:0,animation:'idle'};
  let raf = null;
  let activated = false;
  let idleFrame = 0;
  let idleElapsed = 0;
  let previousFrame = 0;
  let heartTimer = null;
  let shownSprite = null;
  const clamp = (v,a,b) => Math.max(a,Math.min(v,b));
  const bounds = () => ({x:Math.max(0,arena.clientWidth-92),y:Math.max(0,arena.clientHeight-74)});

  function say(text) {if(status.textContent!==text)status.textContent=text;}
  function draw() {
    const b=bounds();motion.x=clamp(motion.x,0,b.x);motion.y=clamp(motion.y,0,b.y);
    pet.style.setProperty('--pm-x',motion.x+'px');pet.style.setProperty('--pm-y',motion.y+'px');
    const frames=sprites[motion.animation]||sprites.idle;
    const nextSprite=frames[(motion.animation==='idle'?idleFrame:motion.frame)%frames.length];
    if(shownSprite!==nextSprite){image.src=nextSprite;shownSprite=nextSprite;}
    heart.style.left=(motion.x+39)+'px';heart.style.top=(motion.y-25)+'px';
  }
  function ensureLoop() {
    if(raf===null&&activated&&!state.paused&&!state.sleep&&!document.hidden){previousFrame=performance.now();raf=requestAnimationFrame(tick);}
  }
  function activate() {activated=true;ensureLoop();}
  function stop(resetEncounter=true) {
    if(raf!==null)cancelAnimationFrame(raf);
    raf=null;motion.target=null;motion.animation=state.sleep?'lie':'idle';
    if(state.sleep)motion.frame=0;
    if(resetEncounter){motion.previous=null;motion.engaged=false;}
    draw();ensureLoop();
  }
  function render() {
    actions.dataset.layout=state.style;style.value=state.style;
    pause.setAttribute('aria-pressed',String(state.paused));pause.querySelector('span').textContent=state.paused?'Продолжить':'Пауза';
    root.querySelector('[data-action=sleep] span').textContent=state.sleep?'Разбудить':'Спать';
    root.querySelector('[data-action=follow]').setAttribute('aria-pressed',String(state.follow));
    root.querySelector('[data-action=follow] span').textContent=state.follow?'Не следовать':'Следовать';
    ball.hidden=!state.playing;opener.hidden=!actions.hidden;main.setAttribute('aria-expanded',String(!globalMenu.hidden));
  }
  function save() {
    window.openai?.setWidgetState?.({modelContent:{menuStyle:state.style},privateContent:{paused:state.paused}}).catch(()=>{});
  }
  function closeMenus() {activate();globalMenu.hidden=true;actions.hidden=true;stop();render();say('Двигайте курсор рядом с лисой');}
  function tick(now) {
    raf=null;
    if(!activated||state.paused||state.sleep||document.hidden)return;
    const dt=clamp((now-previousFrame)/1000,0,.05);previousFrame=now;
    if(motion.target&&blocked())motion.target=null;
    if(motion.target){
      const dx=motion.target.x-motion.x,dy=motion.target.y-motion.y,d=Math.hypot(dx,dy);
      const speed=motion.animation==='run'?150:65;
      if(d<3||now>motion.target.until){motion.target=null;}
      else{
        const step=Math.min(d,speed*dt);motion.x+=dx/d*step;motion.y+=dy/d*step;
        image.style.setProperty('--pm-flip',dx>=0?'1':'-1');
        if(now-motion.lastFrame>=(motion.animation==='run'?198:165)){motion.frame++;motion.lastFrame=now;}
      }
    }
    if(!motion.target){motion.animation='idle';idleElapsed+=dt*1000;while(idleElapsed>=264){idleFrame=(idleFrame+1)%sprites.idle.length;idleElapsed-=264;}}
    draw();raf=requestAnimationFrame(tick);
  }
  function startTarget(x,y,animation,now) {
    const b=bounds();x=clamp(x,0,b.x);y=clamp(y,0,b.y);
    if(Math.hypot(x-motion.x,y-motion.y)<8)return;
    motion.target={x,y,until:now+850};motion.animation=animation;motion.lastPlan=now;
    if(raf===null){previousFrame=now;raf=requestAnimationFrame(tick);}
  }
  function move(event) {
    const r=arena.getBoundingClientRect(),cursor={x:event.clientX-r.left,y:event.clientY-r.top};
    const old=motion.previous,now=performance.now(),gap=now-motion.lastSample;
    motion.previous=cursor;motion.lastSample=now;
    if(blocked()||!old||gap>600)return;
    const dx=cursor.x-(motion.x+46),dy=cursor.y-(motion.y+37),distance=Math.hypot(dx,dy);
    if(state.follow){
      if(distance<=66){stop(false);return;}
      startTarget(motion.x+dx*(distance-66)/distance,motion.y+dy*(distance-66)/distance,distance>150?'run':'walk',now);
      say('Лиса следует за курсором');return;
    }
    if(distance>(motion.engaged?215:160)){motion.engaged=false;return;}
    if(motion.engaged&&!motion.flee&&distance<=66){stop(false);return;}
    if(Math.hypot(cursor.x-old.x,cursor.y-old.y)<3||distance<12||now-motion.lastPlan<400)return;
    if(!motion.engaged){motion.engaged=true;motion.flee=(motion.encounter++%2)===1;}
    if(!motion.flee&&distance<=66)return;
    const step=motion.flee?105:Math.min(85,distance-66),sign=motion.flee?-1:1;
    startTarget(motion.x+sign*dx/distance*step,motion.y+sign*dy/distance*step,motion.flee||distance>110?'run':'walk',now);
    say(motion.flee?'Лиса убегает от курсора':'Лиса догоняет курсор');
  }
  function petAction() {if(state.sleep||state.paused)return;activate();stop();heart.hidden=false;clearTimeout(heartTimer);heartTimer=setTimeout(()=>heart.hidden=true,850);say('Лисе приятно');}
  arena.addEventListener('pointermove',move);
  arena.addEventListener('pointerleave',()=>{motion.previous=null;motion.engaged=false;});
  arena.addEventListener('pointerdown',event=>{if(event.target===arena)closeMenus();});
  pet.addEventListener('click',petAction);
  pet.addEventListener('contextmenu',event=>{event.preventDefault();activate();actions.hidden=false;stop();render();});
  main.addEventListener('click',()=>{activate();globalMenu.hidden=!globalMenu.hidden;stop();render();});
  opener.addEventListener('click',()=>{activate();actions.hidden=false;stop();render();});
  root.querySelector('[data-close]').addEventListener('click',closeMenus);
  style.addEventListener('change',()=>{activate();state.style=style.value==='ring'?'ring':'panel';actions.hidden=false;stop();render();save();});
  pause.addEventListener('click',()=>{activated=true;state.paused=!state.paused;stop();render();say(state.paused?'Питомец на паузе':'Пауза снята');save();});
  root.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{
    activate();
    const action=button.dataset.action;
    if(action==='pet'){closeMenus();petAction();}
    if(action==='ball'){state.playing=!state.playing;closeMenus();render();say(state.playing?'Нажмите на мяч, чтобы покатить':'Игра закончена');}
    if(action==='sleep'){state.sleep=!state.sleep;closeMenus();render();say(state.sleep?'Лиса спит':'Лиса проснулась');}
    if(action==='follow'){state.follow=!state.follow;closeMenus();render();say(state.follow?'Лиса следует за курсором':'Свободные прогулки');}
    if(action==='settings'||action==='more'){globalMenu.hidden=false;stop();render();style.focus();}
  }));
  ball.addEventListener('click',()=>{if(blocked())return;const b=bounds();const x=clamp(motion.x+100,0,b.x);ball.style.left=(x+45)+'px';startTarget(x,130,'run',performance.now());say('Лиса бежит к мячу');});
  root.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenus();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else ensureLoop();});
  new ResizeObserver(()=>{stop();}).observe(arena);
  function restore(saved) {const value=saved?.modelContent?.menuStyle;if(value==='panel'||value==='ring')state.style=value;if(typeof saved?.privateContent?.paused==='boolean')state.paused=saved.privateContent.paused;stop();render();}
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  const design={radius:14};
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>app.style.setProperty('--pm-radius',design.radius+'px')});tweak.addSlider(design,'radius',{label:'Скругление меню',min:6,max:22,unit:'px'});}
})();
</script>

</main></body></html>
