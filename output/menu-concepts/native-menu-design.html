<style>
#native-pet-menu-design{--nd-surface:light-dark(#fbfaf7,#242321);--nd-text:light-dark(#292723,#f3f0ea);--nd-muted:light-dark(#726c63,#b9b3a9);--nd-line:light-dark(#e6e0d6,#48443e);--nd-hover:light-dark(#f3e7d8,#38312a);--nd-pressed:light-dark(#ecd6bd,#493626);--nd-accent:light-dark(#a94e19,#edaa71)}
#native-pet-menu-design *{box-sizing:border-box}
#native-pet-menu-design [hidden]{display:none!important}
#native-pet-menu-design .nd-stage{height:370px;display:flex;align-items:center;justify-content:center;padding:12px}
#native-pet-menu-design .nd-panel,#native-pet-menu-design .nd-ring{font:13.333px 'Segoe UI',sans-serif;color:var(--nd-text);position:relative}
#native-pet-menu-design button{font:inherit;color:var(--nd-text);display:flex;align-items:center;gap:5px;min-height:44px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;padding:0 12px}
#native-pet-menu-design button:hover{background:var(--nd-hover)}
#native-pet-menu-design button:active{background:var(--nd-pressed)}
#native-pet-menu-design .nd-panel{background:var(--nd-surface);border:1px solid var(--nd-line);border-radius:16px;padding:16px;width:272px}
#native-pet-menu-design header{height:60px;display:flex;align-items:center;gap:8px;padding:8px}
#native-pet-menu-design .nd-portrait{width:40px;height:auto;image-rendering:pixelated}
#native-pet-menu-design .nd-identity{min-width:0;flex:1;display:flex;flex-direction:column;gap:0}
#native-pet-menu-design strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}
#native-pet-menu-design .nd-identity span{color:var(--nd-muted);line-height:20px}
#native-pet-menu-design .nd-settings{flex:none;width:44px;height:44px;justify-content:center;padding:0}
#native-pet-menu-design .nd-divider{height:1px;background:var(--nd-line);margin:2px 0}
#native-pet-menu-design .nd-row{width:100%;height:44px;margin-top:2px}
#native-pet-menu-design .nd-row:first-of-type{color:var(--nd-accent)}
#native-pet-menu-design i,#native-pet-menu-design svg{width:20px;height:20px;flex:none}
#native-pet-menu-design .nd-ring{width:368px;height:260px;display:grid;padding:16px 8px;grid-template-columns:112px 112px 112px;grid-template-rows:56px 100px 56px;gap:8px}
#native-pet-menu-design .nd-profile{grid-column:2;grid-row:2;width:96px;justify-self:center;background:var(--nd-surface);border:1px solid var(--nd-line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
#native-pet-menu-design .nd-profile strong{max-width:78px}
#native-pet-menu-design .nd-center-portrait{width:32px;height:auto;image-rendering:pixelated}
#native-pet-menu-design .nd-profile span{color:var(--nd-muted)}
#native-pet-menu-design .nd-target{height:56px;background:var(--nd-surface);border:1px solid var(--nd-line);border-radius:16px;padding:0 8px}
#native-pet-menu-design .nd-top{grid-column:2;grid-row:1;width:112px;justify-self:center}
#native-pet-menu-design .nd-right{grid-column:3;grid-row:2;align-self:center}
#native-pet-menu-design .nd-bottom{grid-column:2;grid-row:3;width:112px;justify-self:center}
#native-pet-menu-design .nd-left{grid-column:1;grid-row:2;align-self:center}
#native-pet-menu-design .nd-submenu{position:absolute;z-index:2;bottom:16px;right:16px;min-width:220px;background:var(--nd-surface);border:1px solid var(--nd-line);border-radius:8px;padding:6px}
#native-pet-menu-design .nd-submenu button{width:100%}
#native-pet-menu-design .nd-status{display:block;text-align:center;min-height:28px;color:var(--nd-muted);font:13px 'Segoe UI',sans-serif}
@media(max-width:400px){#native-pet-menu-design .nd-ring{display:flex;flex-direction:column;width:272px;height:auto;padding:16px;gap:2px;background:var(--nd-surface);border:1px solid var(--nd-line);border-radius:16px}#native-pet-menu-design .nd-profile{width:100%;height:60px;flex-direction:row;justify-content:space-between;border:0;padding:8px}#native-pet-menu-design .nd-target{width:100%;height:44px;min-height:44px;border-color:transparent;border-radius:8px;align-self:stretch}}
</style>
<script>
(()=>{const root=document.getElementById('native-pet-menu-design');
for(const section of root.querySelectorAll('[data-variant]')){
 const status=section.querySelector('output');
 section.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
 const more=button.classList.contains('nd-more');
 if(more){const submenu=section.querySelector('.nd-submenu');submenu.hidden=!submenu.hidden;button.setAttribute('aria-expanded',String(!submenu.hidden));}
 else{status.textContent=button.getAttribute('aria-label')||button.textContent.trim();section.querySelector('.nd-submenu').hidden=true;section.querySelector('.nd-more').setAttribute('aria-expanded','false');}
 });
 section.addEventListener('keydown',event=>{if(event.key==='Escape'){section.querySelector('.nd-submenu').hidden=true;section.querySelector('.nd-more').setAttribute('aria-expanded','false');}});
 if(globalThis.Tweak){const state={radius:16};const component=section.querySelector('.nd-panel,.nd-ring');const tweak=new Tweak({container:component,onChange:()=>component.style.borderRadius=state.radius+'px'});tweak.addSlider(state,'radius',{label:'Скругление',min:8,max:20,unit:'px'});}
}
})();
</script>
